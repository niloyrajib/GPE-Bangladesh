<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 130" width="520" height="130" fill="none">
  <defs>
    <linearGradient id="emeraldTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="60%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="electricBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="phoneGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="logoGlow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#059669" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- Modern Integrated Emblem Mark: Gadget, Phone, Electronics -->
  <g filter="url(#logoGlow)" transform="translate(10, 10)">
    <!-- Base App Icon / Squircle Shield -->
    <rect width="110" height="110" rx="30" fill="url(#emeraldTeal)"/>
    <!-- Gadget: Smartwatch / Circular Tech Ring & Sensor Nodes -->
    <circle cx="55" cy="55" r="40" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.25" stroke-dasharray="4 4"/>
    <circle cx="55" cy="55" r="48" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.4"/>
    <!-- Phone Silhouette in the Center -->
    <rect x="36" y="24" width="38" height="62" rx="9" fill="url(#phoneGlow)" stroke="#065F46" stroke-width="1"/>
    <!-- Phone Screen Display Area -->
    <rect x="39" y="31" width="32" height="47" rx="5" fill="#0B1329"/>
    <!-- Phone Speaker Notch & Home Indicator -->
    <rect x="49" y="27" width="12" height="2" rx="1" fill="#94A3B8"/>
    <rect x="50" y="74" width="10" height="2" rx="1" fill="#64748B"/>
    <!-- Electronics: Electric Energy Lightning Bolt inside Phone Screen -->
    <path d="M57 36L46 49H54L52 64L64 50H56L59 36Z" fill="url(#electricBolt)"/>
    <!-- Microchip / Tech Connector Nodes (G = Gadget accents) -->
    <circle cx="26" cy="55" r="3.5" fill="#FFFFFF"/>
    <line x1="29.5" y1="55" x2="36" y2="55" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="84" cy="55" r="3.5" fill="#34D399"/>
    <line x1="74" y1="55" x2="80.5" y2="55" stroke="#34D399" stroke-width="2"/>
  </g>
  <!-- Brand Typography & Acronym Breakdown -->
  <!-- "GPE" Large Acronym -->
  <text x="142" y="62" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="46" fill="#0F172A" letter-spacing="-1.5">GPE</text>
  <!-- Country Wordmark Badge -->
  <rect x="254" y="30" width="156" height="34" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
  <text x="268" y="53" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15" fill="#059669" letter-spacing="2">BANGLADESH</text>
  <!-- Genuine Trust Micro-Pill -->
  <rect x="420" y="34" width="76" height="26" rx="8" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
  <text x="430" y="51" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#0284C7" letter-spacing="1">ORIGINAL</text>
  <!-- The Acronym Definition Subtitle: GADGET • PHONE • ELECTRONICS -->
  <g transform="translate(144, 85)">
    <!-- G - Gadget -->
    <rect x="0" y="0" width="16" height="16" rx="4" fill="#059669"/>
    <text x="5" y="12" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10" fill="#FFFFFF">G</text>
    <text x="21" y="12" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#0F172A" letter-spacing="0.5">Gadget</text>
    <!-- Separator Dot -->
    <circle cx="80" cy="8" r="2.5" fill="#CBD5E1"/>
    <!-- P - Phone -->
    <rect x="94" y="0" width="16" height="16" rx="4" fill="#0284C7"/>
    <text x="100" y="12" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10" fill="#FFFFFF">P</text>
    <text x="115" y="12" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#0F172A" letter-spacing="0.5">Phone</text>
    <!-- Separator Dot -->
    <circle cx="166" cy="8" r="2.5" fill="#CBD5E1"/>
    <!-- E - Electronics -->
    <rect x="180" y="0" width="16" height="16" rx="4" fill="#F59E0B"/>
    <text x="186" y="12" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10" fill="#FFFFFF">E</text>
    <text x="201" y="12" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#0F172A" letter-spacing="0.5">Electronics</text>
  </g>
  <!-- Tagline Sub-bar -->
  <text x="144" y="116" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#64748B" letter-spacing="2.5">FAST EXPRESS SHOPPING • GENUINE TECH RETAIL</text>
</svg>
