<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="iconEmeraldTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="60%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="iconBolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="iconPhoneGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="iconGlow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#059669" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g filter="url(#iconGlow)" transform="translate(5, 5)">
    <!-- Base Squircle Shield -->
    <rect width="110" height="110" rx="30" fill="url(#iconEmeraldTeal)"/>
    <!-- Gadget: Circular Tech Ring -->
    <circle cx="55" cy="55" r="40" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.3" stroke-dasharray="4 4"/>
    <circle cx="55" cy="55" r="48" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.5"/>
    <!-- Phone Silhouette -->
    <rect x="36" y="24" width="38" height="62" rx="9" fill="url(#iconPhoneGlow)" stroke="#065F46" stroke-width="1"/>
    <!-- Phone Screen Display Area -->
    <rect x="39" y="31" width="32" height="47" rx="5" fill="#0B1329"/>
    <!-- Phone Speaker Notch & Home Indicator -->
    <rect x="49" y="27" width="12" height="2" rx="1" fill="#94A3B8"/>
    <rect x="50" y="74" width="10" height="2" rx="1" fill="#64748B"/>
    <!-- Electronics: Gold Lightning Bolt inside Phone Screen -->
    <path d="M57 36L46 49H54L52 64L64 50H56L59 36Z" fill="url(#iconBolt)"/>
    <!-- Tech Connector Nodes -->
    <circle cx="26" cy="55" r="3.5" fill="#FFFFFF"/>
    <line x1="29.5" y1="55" x2="36" y2="55" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="84" cy="55" r="3.5" fill="#34D399"/>
    <line x1="74" y1="55" x2="80.5" y2="55" stroke="#34D399" stroke-width="2"/>
  </g>
</svg>
